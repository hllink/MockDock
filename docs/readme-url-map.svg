<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">MockDock URL mapping</title>
  <desc id="desc">The URL http://localhost:52052/acme/users/123/profile is split into host, workspace, and route path sections.</desc>
  <rect width="920" height="220" rx="24" fill="#0e1715"/>
  <rect x="28" y="28" width="864" height="164" rx="18" fill="#13231f" stroke="#27423a"/>
  <text x="52" y="78" fill="#8ca39c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">http://localhost:52052/</text>
  <text x="380" y="78" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">acme</text>
  <text x="438" y="78" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">/users/123/profile</text>

  <path d="M402 94 L402 126" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
  <path d="M606 94 L606 126" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <rect x="330" y="128" width="144" height="42" rx="21" fill="#134e4a" stroke="#5eead4"/>
  <text x="402" y="156" fill="#ccfbf1" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">workspace</text>

  <rect x="512" y="128" width="188" height="42" rx="21" fill="#713f12" stroke="#fbbf24"/>
  <text x="606" y="156" fill="#fef3c7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">route path</text>
</svg>
